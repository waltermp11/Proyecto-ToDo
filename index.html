<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Organized - Web Todo</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-body-dark text-white p-3 p-md-4">

    <div class="container-fluid max-width-container">


        <header class="custom-card navbar-card d-flex justify-content-between align-items-center px-4 py-3 mb-4">
            <h1 class="h4 mb-0 fw-bold text-white">Be Organized - Web Todo</h1>
            <div class="d-flex gap-2">
                <button class="btn btn-custom-green btn-pill fw-bold">Ingresar</button>
                <button class="btn btn-custom-orange btn-pill fw-bold">Registrarse</button>
            </div>
        </header>


        <div class="row g-4">

            <!-- Panel izquierdo - form -->
            <div class="col-12 col-lg-5 col-xl-4">
                <div class="custom-card p-4 h-100">
                    <h2 class="h2 text-center fw-bold mb-4">Formulario</h2>

                    <form id="formulario" onsubmit="event.preventDefault();">

                        <div class="mb-3">
                            <label for="taskName" class="form-label fw-bold small text-light">Nombre de la tarea:
                            </label>
                            <input type="text" class="form-control custom-input" id="nombreTarea">
                        </div>


                        <div class="mb-2">
                            <label for="taskDetails" class="form-label fw-bold small text-light">Descripción: </label>
                            <textarea class="form-control custom-input custom-textarea" id="descripcionTarea"
                                rows="4"></textarea>
                        </div>

                        <div class="mb-1">
                            <label for="taskDate" class="form-label fw-bold small text-light">Fecha de
                                Entrega</label>
                            <input type="date" class="form-control custom-input" id="taskFechaEntrega">
                        </div>




                        <div class="mb-1">
                            <label for="taskDate" class="form-label fw-bold small text-light">Estado: </label>
                            <select type="select" class="form-control custom-input" id="taskEstado">
                                <option value="">Seleccione un estado</option>
                                <option value="Pendiente">Pendiente</option>
                                <option value="Completado">Completado</option>
                                <option value="Aplazado">Aplazado</option>


                            </select>
                        </div>





                        <div class="mb-4">
                            <label class="form-label fw-bold small text-light d-block mb-2">Asignacion de
                                Prioridad: </label>
                            <div class="d-flex gap-2 justify-content-between">
                                <button type="button" class="btn btn-custom-green btn-prioridad flex-fill fw-bold py-2"
                                    data-value="Baja">Baja</button>
                                <button type="button" class="btn btn-custom-yellow btn-prioridad flex-fill fw-bold py-2"
                                    data-value="Media">Media</button>
                                <button type="button" class="btn btn-custom-red btn-prioridad flex-fill fw-bold py-2"
                                    data-value="Alta">Alta</button>
                            </div>
                            <input type="hidden" id="taskPrioridad" value="">
                        </div>



                        <div class="mt-4 pt-2">
                            <button type="submit" class="btn btn-custom-orange w-100 py-2 fs-5 fw-bold">Enviar</button>
                        </div>
                    </form>

                </div>
            </div>

            <!--Panel derecho - listado de tareas-->
            <div class="col-12 col-lg-7 col-xl-8">
                <div class="custom-card p-4 h-100">
                    <h2 class="h2 fw-bold mb-4">Lista de Tareas</h2>

                    <div class="d-flex flex-column gap-3" id="listadoDeTareas">



                        
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="/js/taskManager.js"></script>
    <script src="/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
